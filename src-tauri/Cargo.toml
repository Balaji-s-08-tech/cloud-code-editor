[package]
name = "cloud-code-editor"
version = "0.1.0"
description = "Cloud Code Editor desktop shell"
authors = ["Cloud Code Editor"]
edition = "2021"

[lib]
name = "cloud_code_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
